name: Deploy Demo (info-demo.esoren.com)

on:
  push:
    branches:
      - main
    paths:
      - "sites/sites.json"
      - "sites/demo/**"
      - "engine/**"
      - "editorial/**"
      - "tools/**"
      - "worker/**"
      - "migrations/**"
      - "cloudflare.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-demo.yml"
      - ".github/workflows/reusable-cf-deploy.yml"
  workflow_dispatch:
    inputs:
      skip_live_smoke:
        description: "Skip post-deploy live URL smoke test (use before binding Custom Domain)"
        required: false
        type: boolean
        default: false

# One active release per site; rapid merges coalesce cleanly to the latest pending commit.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy-demo:
    uses: ./.github/workflows/reusable-cf-deploy.yml
    with:
      site: demo
      environment: demo
      skip_live_smoke: ${{ inputs.skip_live_smoke || false }}
    # Required by GitHub Actions so job-level `environment: demo` exposes environment-scoped secrets
    secrets: inherit
